<title>Calculadora de Preços Córtex</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Identidade Córtex: azul noite, ciano para azul elétrico, Inter, cartões com borda ciano.
   Layout: coluna única pensada para o celular, cabeçalho fixo com a marca, ações fixas no rodapé.
   Visual único e escuro por decisão da marca (mesmo do site da Córtex). */
:root{
  --bg:#020617; --bg-2:#050b22; --surface:#0a1637; --surface-2:rgba(255,255,255,.045);
  --ink:#F1F5F9; --ink-2:#9AA9BF; --line:rgba(148,163,184,.22); --line-cyan:rgba(56,189,248,.18);
  --cyan:#22D3EE; --cyan-2:#67E8F9; --blue:#3B7BFF; --wa:#25D366;
  --accent:#22D3EE; --accent-ink:#020617; --accent-soft:rgba(34,211,238,.10);
  --grad:linear-gradient(135deg,#22D3EE,#3B7BFF);
  --input:rgba(34,211,238,.06); --input-line:rgba(34,211,238,.30);
  --good:#4ADE80; --good-bg:rgba(34,197,94,.15); --warn:#FBBF24; --warn-bg:rgba(251,191,36,.15);
  --bad:#FCA5A5; --bad-bg:rgba(239,68,68,.17); --bad-line:#F87171;
  --neutral:#CBD5E1; --neutral-bg:rgba(148,163,184,.17);
  --c-var:#3B82F6; --c-fix:#94A3B8; --c-tax:#FACC15; --c-fee:#F472B6; --c-profit:#22C55E; --c-loss:#EF4444;
  --f-body:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.55;
  padding-block:0 140px; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(70% 380px at 50% 0,rgba(37,99,255,.20),transparent 70%);
  background-repeat:no-repeat;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:10}
.wrap{max-width:680px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0; text-wrap:balance; line-height:1.15; letter-spacing:-.02em}
h1{font-size:2.05rem; font-weight:800}
h2{font-size:1.55rem; font-weight:700}
h3{font-size:1.08rem; font-weight:700}
p{margin:0}
a{color:var(--cyan-2)}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--cyan)}
.app{display:flex; flex-direction:column; gap:18px; padding-block:22px 8px}

/* cabeçalho da marca */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:rgba(2,6,23,.94); border-bottom:1px solid rgba(255,255,255,.09); backdrop-filter:blur(8px)}
.top .in{display:flex; align-items:center; justify-content:space-between; gap:12px; height:62px}
.logo{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink)}
.logo img{height:38px; width:auto; mix-blend-mode:screen; display:block}
.logo b{display:block; font-size:1.35rem; font-weight:800; letter-spacing:-.02em; line-height:1}
.logo small{display:block; margin-top:4px; font-size:.54rem; letter-spacing:.32em; color:var(--ink-2); line-height:1}
.social{display:flex; gap:8px}
.social a{display:grid; place-items:center; width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,255,255,.16); color:var(--ink)}
.social a:hover{border-color:var(--cyan-2); color:var(--cyan-2)}
.social svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

/* progresso */
.prog{display:flex; flex-direction:column; gap:8px}
.segs{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.segs span{height:5px; border-radius:3px; background:rgba(148,163,184,.25)}
.segs span.done{background:var(--grad)}
.segs span.now{background:var(--cyan); opacity:.6}
.steplabel{font-size:.74rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2)}

/* blocos */
.panel{background:linear-gradient(180deg,rgba(15,28,66,.72),rgba(6,12,32,.92)); border:1px solid var(--line-cyan); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:14px}
.panel.flat{background:var(--surface-2); border-color:var(--line)}
.head{display:flex; flex-direction:column; gap:8px}
.rows{display:flex; flex-direction:column; gap:10px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.grid2.wide{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.field>label{font-size:.85rem; font-weight:600}
.field .hint{font-size:.8rem; color:var(--ink-2)}
.control{display:flex; align-items:center; gap:6px; background:var(--input); border:1.5px solid var(--input-line); border-radius:12px; padding:0 12px; min-height:48px}
.control.text{background:var(--surface-2); border-color:var(--line)}
.control:focus-within{outline:2px solid var(--cyan); outline-offset:1px}
.control.bad{border-color:var(--bad-line); background:var(--bad-bg)}
.control .aff{font-size:.85rem; color:var(--ink-2); font-weight:500}
.control input,.control select{flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:inherit; font-size:16px; padding:11px 0; outline:none}
.control select option{background:#0a1637; color:var(--ink)}
.control input::placeholder{color:var(--ink-2); opacity:.55}
.exprow{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,.7fr) auto; gap:8px; align-items:center}
.iconbtn{border:1px solid var(--line); background:transparent; color:var(--ink-2); width:40px; height:40px; border-radius:10px; font:inherit; font-size:1.15rem; cursor:pointer}
.iconbtn:hover{color:var(--bad); border-color:var(--bad-line)}
.btn{display:inline-flex; align-items:center; justify-content:center; text-align:center; text-decoration:none; font:inherit; font-weight:700; border-radius:12px; padding:12px 18px; min-height:50px; border:1.5px solid transparent; background:var(--grad); color:var(--accent-ink); cursor:pointer; position:relative; overflow:hidden}
.btn.ghost{background:transparent; color:var(--cyan-2); border-color:rgba(34,211,238,.45)}
.btn.link{border-color:transparent; background:transparent; color:var(--cyan-2); padding:8px 4px; min-height:40px; justify-content:flex-start; font-weight:600}
.btn.wa{background:var(--wa); color:#03140a}
.btn:focus-visible,.iconbtn:focus-visible,.social a:focus-visible,a:focus-visible{outline:3px solid var(--cyan-2); outline-offset:2px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn.danger{border-color:var(--bad-line); color:var(--bad); background:transparent}
.btns{display:flex; flex-wrap:wrap; gap:10px}
.btns .btn{flex:1 1 200px}
.cta::after{content:""; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent); transform:skewX(-20deg)}
@media (prefers-reduced-motion:no-preference){
  .cta{animation:glow 2.6s ease-out infinite}
  .cta::after{animation:shine 3.8s ease-in-out infinite}
  .segs span{transition:background .2s}
}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(34,211,238,.5)}70%,100%{box-shadow:0 0 0 14px rgba(34,211,238,0)}}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}

.err{background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad-line); border-radius:12px; padding:12px 14px}
.err ul{margin:6px 0 0; padding-left:18px}
.live{background:var(--accent-soft); border:1px solid var(--line-cyan); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:8px}
.live .big{font-size:1.2rem; font-weight:700; font-variant-numeric:tabular-nums; color:var(--cyan-2)}
.total{display:flex; justify-content:space-between; align-items:baseline; gap:10px; border-top:1px dashed var(--line); padding-top:12px}
.total strong{font-size:1.25rem; font-weight:700; font-variant-numeric:tabular-nums; color:var(--cyan-2)}

/* divisão de R$100 */
.split{display:flex; height:14px; border-radius:7px; overflow:hidden; background:var(--line)}
.split i{display:block; height:100%}
.legend{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:6px 14px; font-size:.85rem}
.legend div{display:flex; align-items:center; gap:7px; min-width:0}
.legend b{font-weight:600; margin-left:auto; font-variant-numeric:tabular-nums}
.dot{width:10px; height:10px; border-radius:3px; flex:none}

/* produtos (entrada) */
.pin{background:linear-gradient(180deg,rgba(15,28,66,.72),rgba(6,12,32,.92)); border:1px solid var(--line-cyan); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px}
.pin .top2{display:flex; align-items:center; justify-content:space-between; gap:10px}
.pin .tag{font-size:.74rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--cyan)}
.pv{font-size:.85rem; background:var(--surface-2); border-radius:10px; padding:9px 12px; color:var(--ink-2)}
.pv b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}

/* resultado */
.kpis{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.kpi{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; min-width:0}
.kpi span{font-size:.7rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2)}
.kpi strong{font-size:1.35rem; font-weight:700; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.kpi.good strong{color:var(--good)} .kpi.warn strong{color:var(--warn)} .kpi.bad strong{color:var(--bad)}
.pill{display:inline-block; font-size:.76rem; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap}
.pill.ok{background:var(--good-bg); color:var(--good)} .pill.warn{background:var(--warn-bg); color:var(--warn)}
.pill.bad{background:var(--bad-bg); color:var(--bad)} .pill.gray{background:var(--neutral-bg); color:var(--neutral)}
.pcard{background:linear-gradient(180deg,rgba(15,28,66,.72),rgba(6,12,32,.92)); border:1px solid var(--line-cyan); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px}
.pcard header{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.pcard header h3{min-width:0; overflow-wrap:anywhere}
.prices{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px}
.price{background:var(--surface-2); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:2px; min-width:0}
.price.main{background:var(--grad); color:var(--accent-ink)}
.price .lab{font-size:.74rem; line-height:1.25; opacity:.88}
.price strong{font-weight:700; font-size:1.2rem; font-variant-numeric:tabular-nums}
.bar{position:relative; display:flex; height:16px; border-radius:8px; overflow:hidden; background:var(--line)}
.bar i{display:block; height:100%}
.bar .mark{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink)}
.cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px}
.list{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px}
.list li{display:flex; justify-content:space-between; gap:12px; align-items:baseline; border-bottom:1px solid var(--line); padding-bottom:7px}
.list li span:first-child{min-width:0; overflow-wrap:anywhere}
.list li b{font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap}
.list li b.neg{color:var(--bad)}
.crow{display:grid; grid-template-columns:minmax(0,34%) minmax(0,1fr) auto; gap:10px; align-items:center; font-size:.85rem}
.ctrack{position:relative; height:18px; background:var(--surface-2); border-radius:4px}
.cbar{position:absolute; top:2px; bottom:2px; border-radius:3px}
.czero{position:absolute; top:-2px; bottom:-2px; width:1px; background:var(--ink-2)}
.cval{font-variant-numeric:tabular-nums; min-width:92px; text-align:right; font-weight:500}

/* intro */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{font-size:.8rem; font-weight:600; padding:5px 12px; border-radius:999px; border:1px solid var(--line-cyan); background:var(--accent-soft); color:var(--cyan-2)}
.hook{display:flex; flex-direction:column; gap:10px; font-size:.95rem}
.hook .eq{background:var(--surface-2); padding:11px 13px; border-radius:10px; overflow-wrap:anywhere; font-size:.9rem}

/* cadastro e chamadas */
.gate .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
.check{display:flex; gap:10px; align-items:flex-start; font-size:.84rem; color:var(--ink-2); line-height:1.45}
.check input{width:20px; height:20px; margin:1px 0 0; flex:none; accent-color:var(--cyan)}
.check.bad{color:var(--bad)}
.hp{position:absolute; left:-9999px; width:1px; height:1px; opacity:0}
.cardapio{border:1px solid rgba(34,211,238,.55); background:linear-gradient(160deg,rgba(34,211,238,.13),rgba(37,99,255,.10) 55%,rgba(6,12,32,.9))}
.cardapio ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:4px; font-size:.93rem}
.price-line{display:flex; flex-wrap:wrap; gap:6px 16px; align-items:baseline}
.price-line strong{font-size:1.7rem; font-weight:800; letter-spacing:-.02em; color:var(--cyan-2)}
.banner{background:var(--accent-soft); border:1px solid var(--line-cyan); border-radius:12px; padding:12px 14px; font-size:.9rem}
.wa-note{background:var(--good-bg); color:var(--good); border-radius:10px; padding:10px 12px; font-size:.85rem}
.foot{display:flex; flex-direction:column; gap:14px; border-top:1px solid rgba(255,255,255,.09); padding-top:22px; margin-top:8px; font-size:.82rem; color:var(--ink-2)}
.foot .brandrow{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}

/* barra fixa */
.navbar{
  position:fixed; left:0; right:0; bottom:0; background:rgba(2,6,23,.96); border-top:1px solid rgba(255,255,255,.1); backdrop-filter:blur(8px);
  padding-top:12px; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); z-index:15;
}
.navbar .in{max-width:680px; margin:0 auto; display:flex; gap:10px}
.navbar .btn{flex:1; padding-left:12px; padding-right:12px}
.navbar .btn.back{flex:0 0 auto}
.copybox{width:100%; min-height:140px; font:inherit; font-size:.8rem; background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px}
</style>


</head>

    m: z(pctv(st.margem)), imp: z(pctv(st.impostos)), t1: z(pctv(st.taxa1)), t2: z(pctv(st.taxa2))
  };
  cfg.d17 = round6(1 - cfg.imp - cfg.t1);
  cfg.d18 = round6(1 - cfg.imp - cfg.t1 - cfg.m);
  cfg.d19 = round6(1 - cfg.imp - cfg.t2 - cfg.m);
  return cfg;
}

function product(p, cfg) {
  const nm = (p.nome || '').trim();
  const raw = [p.mat, p.emb, p.mo, p.out].map(num);
  const vals = raw.filter(ok);
  const started = nm !== '' || raw.some(v => v !== null);
  if (!started) return null;
  const r = { nome: nm, status: null };
  const sum = vals.reduce((a, b) => a + b, 0);
  if (nm === '' || vals.length === 0 || sum <= 0) { r.status = 'Dados incompletos'; return r; }
  const pd = pctv(p.perda);
  const perda = pd === null ? 0 : pd;
  if (Number.isNaN(pd) || perda < 0 || perda >= 1) { r.status = 'Revise a perda (%)'; return r; }
  r.I = sum; r.J = sum / (1 - perda); r.perda = perda;
  if (cfg.rateio === null) { r.status = 'Falta qtd. de vendas'; return r; }
  r.K = cfg.rateio; r.L = r.J + r.K;
  r.M = cfg.d17 > 0 ? r.L / cfg.d17 : null;
  r.N = cfg.d18 > 0 ? r.L / cfg.d18 : null;
  r.O = cfg.d19 > 0 ? r.L / cfg.d19 : null;
  const preco = num(p.preco);
  r.H = ok(preco) && preco > 0 ? preco : null;
  if (r.H !== null) { r.P = r.H; r.base = 'praticado'; }
  else if (r.N !== null && r.N > 0) { r.P = r.N; r.base = 'sugerido'; }
  else { r.status = 'Revise os percentuais'; return r; }
  r.imp = r.P * cfg.imp; r.fee = r.P * cfg.t1;
  r.R = r.P - r.L - r.imp - r.fee;
  r.S = r.R / r.P;
  const qtd = num(p.qtd);
  r.qtd = ok(qtd) ? qtd : null;
  r.T = r.qtd !== null ? r.R * r.qtd : null;
  if (Math.round(r.R * 100) / 100 <= 0) r.status = 'Prejuízo';
  else if (round6(r.S) >= round6(cfg.m)) r.status = 'Saudável';
  else r.status = 'Abaixo da meta';
  return r;
}

function analyze(st) {
  const cfg = config(st);
  const items = st.produtos.map(p => product(p, cfg)).filter(Boolean);
  const calc = items.filter(i => i.R !== undefined);
  const withT = calc.filter(i => i.T !== null);
  const count = s => items.filter(i => i.status === s).length;
  return {
    cfg, items, calc, withT,
    saudavel: count('Saudável'), abaixo: count('Abaixo da meta'), prejuizo: count('Prejuízo'),
    incompletos: items.length - count('Saudável') - count('Abaixo da meta') - count('Prejuízo'),
    custoMedio: calc.length ? calc.reduce((a, i) => a + i.L, 0) / calc.length : null,
    lucroTotal: withT.length ? withT.reduce((a, i) => a + i.T, 0) : null,
    maiores: withT.slice().sort((a, b) => b.T - a.T),
    menores: withT.slice().sort((a, b) => a.T - b.T),
    abaixoLista: calc.filter(i => i.status === 'Abaixo da meta' || i.status === 'Prejuízo'),
    abaixoMinimo: calc.filter(i => i.H !== null && i.M !== null && Math.round(i.H * 100) < Math.round(i.M * 100))
  };
}

function normWhats(s) {
  let d = String(s || '').replace(/\D/g, '');
  if ((d.length === 12 || d.length === 13) && d.indexOf('55') === 0) d = d.slice(2);
  if (d.length < 10 || d.length > 11) return null;
  const ddd = Number(d.slice(0, 2));
  if (ddd < 11 || ddd > 99) return null;
  if (d.length === 11 && d.charAt(2) !== '9') return null;
  return '55' + d;
}

function copiarTexto(t) {
  const legado = () => {

      document.body.appendChild(ta); ta.select(); const r = document.execCommand('copy'); ta.remove(); return r; } catch (e) { return false; }
  };
  return new Promise(res => {
    try { navigator.clipboard.writeText(t).then(() => res(true)).catch(() => res(legado())); } catch (e) { res(legado()); }
  });
}

    '<div class="head gate"><p class="eyebrow">Seu resultado está pronto</p>' +
    '<h2>Falta só dizer para onde enviar</h2>' +
    '<p class="muted">Calculamos ' + a.calc.length + (a.calc.length === 1 ? ' produto' : ' produtos') + ' com os seus dados. Informe seu nome e WhatsApp para liberar a tela completa.</p></div>' +
    '<div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">' +
    '<div class="kpi good"><span>Saudáveis</span><strong>' + a.saudavel + '</strong></div>' +
    '<div class="kpi warn"><span>Abaixo da meta</span><strong>' + a.abaixo + '</strong></div>' +
    '<div class="kpi bad"><span>Em prejuízo</span><strong>' + a.prejuizo + '</strong></div></div>' +
    '<form class="panel" id="leadform" novalidate>' +
    field('Seu nome', ctl('lead-nome', 'lead', 0, 'nome', L.nome, { text: true, ph: 'Como podemos te chamar', ac: 'name', label: 'Seu nome' })) +
    field('Seu WhatsApp com DDD', ctl('lead-whats', 'lead', 0, 'whats', L.whats, { text: true, type: 'tel', ac: 'tel', inputmode: 'tel', ph: '(67) 99999-0000', label: 'Seu WhatsApp com DDD' })) +
    field('Nome do seu negócio', ctl('lead-negocio', 'lead', 0, 'negocio', L.negocio, { text: true, ph: 'Opcional', ac: 'organization', label: 'Nome do seu negócio' })) +
    field('Tipo de negócio', '<div class="control text" id="c-lead-segmento"><select id="lead-segmento" data-k="lead" data-i="0" data-f="segmento" aria-label="Tipo de negócio">' + opts + '</select></div>') +
    '<input class="hp" id="lead-site" name="website" data-k="hp" data-i="0" data-f="hp" tabindex="-1" autocomplete="off" aria-hidden="true">' +
    '<label class="check" id="c-lead-aceite"><input type="checkbox" id="lead-aceite" data-k="lead" data-i="0" data-f="aceite"' + (L.aceite ? ' checked' : '') + '>' +
    '<span>Autorizo a Córtex a guardar meus dados e o resumo desta calculadora e a me chamar no WhatsApp sobre a calculadora e o cardápio digital. Para apagar meus dados, é só pedir pelo WhatsApp da Córtex.</span></label>' +
    '</form>';
}

// ---------------------------------------------------------------- resultado
const PILL = { 'Saudável': 'ok', 'Abaixo da meta': 'warn', 'Prejuízo': 'bad' };

function compBar(i) {
  const parts = [
    ['Custo do produto', i.J, 'var(--c-var)'],
    ['Despesas fixas (rateio)', i.K, 'var(--c-fix)'],
    ['Impostos', i.imp, 'var(--c-tax)'],
    ['Taxa do canal', i.fee, 'var(--c-fee)']
  ];
  const lucro = i.R > 0 ? i.R : 0;
  const total = i.J + i.K + i.imp + i.fee + lucro;
  const seg = parts.concat([['Lucro', lucro, 'var(--c-profit)']]);
  let html = '<div class="bar" role="img" aria-label="Composição do preço">' +
    seg.filter(s => s[1] > 0).map(s => '<i style="width:' + (s[1] / total * 100).toFixed(2) + '%;background:' + s[2] + '"></i>').join('');
  if (i.R <= 0) html += '<span class="mark" style="left:' + (i.P / total * 100).toFixed(2) + '%" title="Preço"></span>';
  html += '</div><div class="legend">' +
    seg.map(s => '<div><span class="dot" style="background:' + s[2] + '"></span>' + s[0] + '<b>' + brl(s[1]) + '</b></div>').join('') + '</div>';
  if (i.R <= 0) html += '<p class="small muted">A marca clara é o preço de venda (' + brl(i.P) + '). Os custos passam dela.</p>';
  return html;
}

function cardResultado(i, a) {
  const cfg = a.cfg;
  const c1 = esc(st.canal1.trim() || 'Canal principal');
  const c2 = esc(st.canal2.trim() || 'Segundo canal');
  if (i.R === undefined) {
    return '<article class="pcard"><header><h3>' + esc(i.nome || 'Sem nome') + '</h3><span class="pill gray">' + esc(i.status) + '</span></header>' +
      '<p class="muted small">Volte e complete os dados deste produto.</p></article>';
  }
  const mn = i.M !== null ? brl(i.M) : '—', sg = i.N !== null ? brl(i.N) : '—', s2 = i.O !== null ? brl(i.O) : '—';
  let linha;
  if (i.base === 'praticado') {
    linha = 'Com o seu preço de <b>' + brl(i.P) + '</b>: ' + (i.R >= 0 ? 'lucro' : 'prejuízo') + ' de <b>' + brl(Math.abs(i.R)) + '</b> por unidade (margem de ' + pct1(i.S) + ').';
  } else {
    linha = 'Sem preço atual informado. No preço sugerido de <b>' + brl(i.P) + '</b>, o lucro é de <b>' + brl(i.R) + '</b> por unidade (' + pct1(i.S) + ').';
  }
  let dica = '';
  if (i.status === 'Prejuízo') dica = 'Você perde dinheiro em cada venda. Para empatar, cobre pelo menos ' + brl(i.M) + (i.N !== null ? ' e, para chegar à meta de ' + pct1(cfg.m) + ', cobre ' + brl(i.N) : '') + '.';
  else if (i.status === 'Abaixo da meta' && i.N !== null) dica = 'Dá lucro, mas abaixo da meta de ' + pct1(cfg.m) + '. Para atingir a meta, cobre ' + brl(i.N) + '.';
  return '<article class="pcard"><header><h3>' + esc(i.nome) + '</h3><span class="pill ' + (PILL[i.status] || 'gray') + '">' + i.status + '</span></header>' +
    '<div class="prices">' +
    '<div class="price main"><span class="lab">Preço sugerido · ' + c1 + '</span><strong>' + sg + '</strong></div>' +
    '<div class="price"><span class="lab">Preço sugerido · ' + c2 + '</span><strong>' + s2 + '</strong></div>' +
    '<div class="price"><span class="lab">Preço mínimo (lucro zero) · ' + c1 + '</span><strong>' + mn + '</strong></div></div>' +
    '<p class="small">' + linha + '</p>' + (dica ? '<p class="small"><b>' + dica + '</b></p>' : '') +
    compBar(i) +
    (i.T !== null ? '<p class="small muted">Lucro estimado no mês: <b class="num" style="color:var(--' + (i.T >= 0 ? 'good' : 'bad') + ')">' + brl(i.T) + '</b> (' + int(i.qtd) + ' un.)</p>' : '<p class="small muted">Informe as vendas por mês deste produto para ver o lucro do mês.</p>') +
    '</article>';
}

function listaRank(arr, n) {
  if (!arr.length) return '<p class="muted small">Sem dados suficientes. Informe as vendas por mês dos produtos.</p>';
  return '<ol class="list">' + arr.slice(0, n).map((i, k) =>
    '<li><span>' + (k + 1) + '. ' + esc(i.nome) + '</span><b class="' + (i.T < 0 ? 'neg' : '') + '">' + brl(i.T) + '</b></li>').join('') + '</ol>';
}

function chart(a) {
  const rows = a.maiores.slice(0, 15);
  if (!rows.length) return '<p class="muted small">Informe as vendas por mês de pelo menos um produto para ver o gráfico.</p>';
  const max = Math.max.apply(null, rows.map(r => r.T).concat([0]));
  const min = Math.min.apply(null, rows.map(r => r.T).concat([0]));
  const range = (max - min) || 1;
  const zero = (-min / range) * 100;
  return '<div class="rows">' + rows.map(r => {
    const w = Math.abs(r.T) / range * 100;
    const left = r.T >= 0 ? zero : zero - w;
    return '<div class="crow"><span>' + esc(r.nome) + '</span><div class="ctrack"><div class="cbar" style="left:' + left.toFixed(2) + '%;width:' + w.toFixed(2) +
      '%;background:' + (r.T >= 0 ? 'var(--c-profit)' : 'var(--c-loss)') + '"></div><div class="czero" style="left:' + zero.toFixed(2) + '%"></div></div><span class="cval">' + brl(r.T) + '</span></div>';
  }).join('') + '</div>';
}

function viewResultado() {
  const a = analyze(st), cfg = a.cfg;
  const n = a.items.length;
  const meta = pct1(cfg.m);
  let resumo;
  if (!a.calc.length) resumo = 'Não foi possível calcular. Volte e confira as etapas.';
  else resumo = a.saudavel + ' de ' + a.calc.length + (a.calc.length === 1 ? ' produto atinge' : ' produtos atingem') + ' a margem de ' + meta + '.' +
    (a.prejuizo ? ' ' + (a.prejuizo === 1 ? 'Um produto está dando prejuízo.' : a.prejuizo + ' produtos estão dando prejuízo.') : '');
  const lt = a.lucroTotal;
  const quem = primeiroNome();
  return '<div class="head"><p class="eyebrow">' + (st.exemplo ? 'Resultado de exemplo' : quem ? 'Resultado de ' + esc(quem) : 'Resultado') + '</p><h2>' + esc(resumo) + '</h2>' +
    '<p class="muted small">Rateio de despesas fixas: ' + brl(cfg.total) + ' ÷ ' + int(cfg.q) + ' un. = <b class="num">' + brl(cfg.rateio) + '</b> por unidade (estimativa, depende das vendas informadas).</p></div>' +
    (st.exemplo ? '<div class="banner">Estes são dados de exemplo. Para ver os números do seu negócio, toque em <b>Fazer a minha</b>.</div>' : '') +
    '<div class="kpis">' +
    '<div class="kpi"><span>Despesas fixas/mês</span><strong>' + brl(cfg.total) + '</strong></div>' +
    '<div class="kpi"><span>Produtos cadastrados</span><strong>' + n + '</strong></div>' +
    '<div class="kpi"><span>Custo médio unitário</span><strong>' + (a.custoMedio === null ? 'n/d' : brl(a.custoMedio)) + '</strong></div>' +
    '<div class="kpi ' + (lt === null ? '' : lt >= 0 ? 'good' : 'bad') + '"><span>Lucro estimado/mês</span><strong>' + (lt === null ? 'n/d' : brl(lt)) + '</strong></div>' +
    '<div class="kpi good"><span>Margem saudável</span><strong>' + a.saudavel + '</strong></div>' +
    '<div class="kpi warn"><span>Abaixo da meta</span><strong>' + a.abaixo + '</strong></div>' +
    '<div class="kpi bad"><span>Em prejuízo</span><strong>' + a.prejuizo + '</strong></div>' +
    '<div class="kpi"><span>Dados incompletos</span><strong>' + a.incompletos + '</strong></div></div>' +
    '<h3>Preço de cada produto</h3>' + a.items.map(i => cardResultado(i, a)).join('') +
    '<div class="cols">' +
    '<div class="panel"><h3>Maior lucro no mês</h3>' + listaRank(a.maiores, 5) + '</div>' +
    '<div class="panel"><h3>Menor lucro no mês</h3>' + listaRank(a.menores, 5) + '</div>' +
    '<div class="panel"><h3>Margem abaixo da meta</h3>' + (a.abaixoLista.length
      ? '<ul class="list">' + a.abaixoLista.slice(0, 10).map(i => '<li><span>' + esc(i.nome) + '</span><b class="' + (i.S < 0 ? 'neg' : '') + '">' + pct1(i.S) + '</b></li>').join('') + '</ul>'
      : '<p class="muted small">Nenhum produto abaixo da meta.</p>') + '</div>' +
    '<div class="panel"><h3>Preço atual abaixo do mínimo</h3>' + (a.abaixoMinimo.length
      ? '<ul class="list">' + a.abaixoMinimo.slice(0, 10).map(i => '<li><span>' + esc(i.nome) + '</span><b>faltam ' + brl(i.M - i.H) + '</b></li>').join('') + '</ul>'
      : (a.calc.some(i => i.H !== null) ? '<p class="muted small">Nenhum produto vendido abaixo do mínimo.</p>' : '<p class="muted small">Informe o preço que você cobra hoje para ver esta análise.</p>')) + '</div>' +
    '</div>' +
    '<div class="panel"><h3>Lucro mensal por produto</h3>' + chart(a) + '</div>' +
    '<div id="wa-note" class="wa-note" role="status"' + (waAviso ? '>' + waAviso : ' hidden>') + '</div>' +
    '<div class="panel flat" id="copy-area"><p class="small muted">Os resultados dependem da qualidade dos dados que você informou. Use custos reais e uma estimativa de vendas realista. Esta calculadora é um apoio e não substitui orientação contábil.</p>' +
    '<div class="btns"><button class="btn ghost" data-act="copy">Copiar resumo em texto</button>' +
    '<button class="btn danger" data-act="reset">' + (confirmaReset ? 'Confirmar: apagar tudo e recomeçar' : 'Recomeçar do zero') + '</button></div></div>' +
    rodape();
}

function resumoTexto() {
  const a = analyze(st), cfg = a.cfg;
  const c1 = st.canal1.trim() || 'Canal principal', c2 = st.canal2.trim() || 'Segundo canal';
  const L = ['CALCULADORA DE PREÇOS CÓRTEX — RESUMO', '',
    'Despesas fixas por mês: ' + brl(cfg.total), 'Vendas estimadas por mês: ' + int(cfg.q) + ' un.',
    'Rateio fixo por unidade: ' + brl(cfg.rateio), 'Margem desejada: ' + pct1(cfg.m), ''];
  a.items.forEach(i => {
    if (i.R === undefined) { L.push(i.nome + ': ' + i.status); return; }
    L.push(i.nome + ' [' + i.status + ']');
    L.push('  Preço mínimo (' + c1 + '): ' + (i.M !== null ? brl(i.M) : '—'));
    L.push('  Preço sugerido (' + c1 + '): ' + (i.N !== null ? brl(i.N) : '—'));
    L.push('  Preço sugerido (' + c2 + '): ' + (i.O !== null ? brl(i.O) : '—'));
    L.push('  Lucro por unidade: ' + brl(i.R) + ' (' + pct1(i.S) + ')' + (i.T !== null ? ' · no mês: ' + brl(i.T) : ''));
  });
  L.push('', 'Feito com a Calculadora de Preços da Córtex Soluções Digitais — ' + CONFIG.INSTAGRAM);
  return L.join('\n');
}

// ---------------------------------------------------------------- validação
function validarLead() {
  const e = [], L = st.lead;
  if ((L.nome || '').trim().length < 2) e.push({ id: 'lead-nome', msg: 'Informe seu nome.' });
  if (!normWhats(L.whats)) e.push({ id: 'lead-whats', msg: 'Digite o WhatsApp com DDD, por exemplo (67) 99999-0000.' });
  if (!L.aceite) e.push({ id: 'lead-aceite', msg: 'Marque a autorização para liberar o resultado.' });
  return e;
}

function validar(step) {
  const e = [];
  const add = (id, msg) => e.push({ id: id, msg: msg });
  if (step === 1) {
    st.despesas.forEach((d, i) => {
      const v = num(d.valor);
      if (Number.isNaN(v) || (ok(v) && v < 0)) add('desp-valor-' + i, 'Despesa ' + (i + 1) + ': digite um valor em reais, como 1500 ou 1.500,50.');
    });
  }
  if (step === 2) {
    const q = num(st.vendas);
    if (q === null) add('vendas', 'Informe quantas unidades você espera vender por mês.');
    else if (Number.isNaN(q) || q <= 0) add('vendas', 'A quantidade de vendas precisa ser um número maior que zero.');
  }
  if (step === 3) {
    const cfg = config(st);
    [['margem', 'Margem'], ['impostos', 'Impostos'], ['taxa1', 'Taxa do canal principal'], ['taxa2', 'Taxa do segundo canal']].forEach(p => {
      const v = pctv(st[p[0]]);
      if (Number.isNaN(v) || (ok(v) && (v < 0 || v >= 1))) add(p[0], p[1] + ': digite uma porcentagem entre 0 e 99 (ex.: 20).');
    });
    if (pctv(st.margem) === null) add('margem', 'Informe a margem de lucro desejada (digite 0 se não quiser margem).');
    if (!e.length) {
      if (cfg.d18 <= 0) add('margem', 'Impostos + taxa do canal principal + margem somam 100% ou mais. Reduza algum deles.');
      if (cfg.d19 <= 0) add('taxa2', 'Impostos + taxa do segundo canal + margem somam 100% ou mais. Reduza algum deles.');
    }
  }
  if (step === 4) {
    let validos = 0;
    st.produtos.forEach((p, i) => {
      const nm = (p.nome || '').trim();
      const raw = [p.mat, p.emb, p.mo, p.out].map(num);
      const tem = nm !== '' || raw.some(v => v !== null) || num(p.perda) !== null || num(p.qtd) !== null || num(p.preco) !== null;
      if (!tem) return;
      const n = 'Produto ' + (i + 1) + ': ';
      let bom = true;
      if (nm === '') { add('p-' + i + '-nome', n + 'informe o nome.'); bom = false; }
      [['mat', 'materiais'], ['emb', 'embalagem'], ['mo', 'mão de obra'], ['out', 'outros custos'], ['qtd', 'vendas por mês'], ['preco', 'preço atual']].forEach(c => {
        const v = num(p[c[0]]);
        if (Number.isNaN(v) || (ok(v) && v < 0)) { add('p-' + i + '-' + c[0], n + 'valor inválido em ' + c[1] + '.'); bom = false; }
      });
      const pd = pctv(p.perda);
      if (Number.isNaN(pd) || (ok(pd) && (pd < 0 || pd >= 1))) { add('p-' + i + '-perda', n + 'a perda deve ficar entre 0 e 99%.'); bom = false; }
      const soma = raw.filter(ok).reduce((x, y) => x + y, 0);
      if (soma <= 0 && nm !== '') { add('p-' + i + '-mat', n + 'informe pelo menos um custo maior que zero.'); bom = false; }
      if (bom) validos++;
    });
    if (!e.length && validos === 0) add('p-0-nome', 'Cadastre pelo menos um produto ou serviço.');
  }
  return e;
}

// ---------------------------------------------------------------- atualização ao vivo
function live() {
  const cfg = config(st);
  const t = $('#desp-total'); if (t) t.textContent = brl(cfg.total);
  const rb = $('#rateio-box');
  if (rb) {
    rb.innerHTML = cfg.rateio === null
      ? '<span class="small">Digite as vendas por mês para ver quanto de despesa fixa cada unidade carrega.</span>'
      : '<span class="small">Despesas fixas ' + brl(cfg.total) + ' ÷ ' + int(cfg.q) + ' unidades</span><span class="big">= ' + brl(cfg.rateio) + ' por unidade</span>' +
        (cfg.total === 0 ? '<span class="small">Você não informou despesas fixas, então o rateio é zero. Se existem, volte e preencha.</span>' : '');
  }
  const sb = $('#split-box');
  if (sb) {
    const bloco = (nome, taxa) => {
      const resto = 100 * (1 - cfg.imp - taxa - cfg.m);
      const r = v => 'R$ ' + (100 * v).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
      const seg = [['Impostos', cfg.imp, 'var(--c-tax)'], ['Taxa do canal', taxa, 'var(--c-fee)'], ['Sua margem', cfg.m, 'var(--c-profit)'], ['Sobra para custos', Math.max(0, resto / 100), 'var(--c-var)']];
      return '<div class="rows"><b>De cada R$ 100 que o cliente paga em ' + esc(nome || 'este canal') + '</b>' +
        '<div class="split">' + seg.filter(s => s[1] > 0).map(s => '<i style="width:' + (s[1] * 100).toFixed(2) + '%;background:' + s[2] + '"></i>').join('') + '</div>' +
        '<div class="legend">' + seg.map(s => '<div><span class="dot" style="background:' + s[2] + '"></span>' + s[0] + '<b>' + r(s[1]) + '</b></div>').join('') + '</div>' +
        (resto <= 0 ? '<p class="small" style="color:var(--bad)"><b>Não sobra nada para cobrir os custos. Reduza a margem, os impostos ou a taxa.</b></p>' : '') + '</div>';
    };
    sb.innerHTML = bloco(st.canal1.trim(), cfg.t1) + '<hr style="border:0;border-top:1px dashed var(--line);width:100%">' + bloco(st.canal2.trim(), cfg.t2);
  }
  st.produtos.forEach((p, i) => {
    const pv = $('#pv-' + i); if (!pv) return;
    const r = product(p, cfg);
    if (!r) { pv.innerHTML = 'Preencha o nome e os custos para ver o preço sugerido.'; return; }
    if (r.L === undefined) { pv.innerHTML = r.status === 'Dados incompletos' ? 'Falta o nome ou algum custo maior que zero.' : esc(r.status); return; }
    pv.innerHTML = 'Custo total por unidade <b>' + brl(r.L) + '</b> · preço sugerido em ' + esc(st.canal1.trim() || 'canal principal') + ' <b>' + (r.N !== null ? brl(r.N) : '—') + '</b>';
  });
}

// ---------------------------------------------------------------- render
const telaGate = () => CONFIG.EXIGIR_CADASTRO && !st.liberado && !st.exemplo;

function render(errs, focusId) {
  const bar = $('#navbar'), nav = $('#navin');
  let html = '';
  if (st.step === 0) html = viewIntro();
  else if (st.step === 1) html = viewDespesas(errs);
  else if (st.step === 2) html = viewVendas(errs);
  else if (st.step === 3) html = viewTaxas(errs);
  else if (st.step === 4) html = viewProdutos(errs);
  else html = telaGate() ? viewGate(errs) : header(5) + viewResultado();
  app.innerHTML = html;

  if (st.step === 0) bar.hidden = true;
  else {
    bar.hidden = false;
    if (st.step < 5) nav.innerHTML = '<button class="btn ghost back" data-act="back">Voltar</button><button class="btn cta" data-act="next">' + (st.step === 4 ? 'Ver resultado' : 'Continuar') + '</button>';
    else if (telaGate()) nav.innerHTML = '<button class="btn ghost back" data-act="back">Voltar</button><button class="btn cta" data-act="submit">Ver meu resultado</button>';
    else if (st.exemplo) nav.innerHTML = '<button class="btn ghost back" data-act="back">Editar</button><button class="btn cta" data-act="start">Fazer a minha</button>';
    else nav.innerHTML = '<button class="btn ghost back" data-act="back">Editar respostas</button><a class="btn wa cta" data-act="wa" href="' + esc(waHref()) + '" target="_blank" rel="noopener">Avaliar meu negócio</a>';
  }
  live();
  if (errs && errs.length) {
    errs.forEach(x => { const c = $('#c-' + x.id); if (c) c.classList.add('bad'); });
    const first = $('#' + errs[0].id); if (first) first.focus({ preventScroll: false });
    const eb = $('#errbox'); if (eb && eb.scrollIntoView) eb.scrollIntoView({ block: 'center' });
  } else if (focusId) {
    const el = $('#' + focusId); if (el) el.focus();
  } else window.scrollTo(0, 0);
  salvar();
  if (st.step === 5 && !telaGate()) sincronizar();
}

function ir(n) { confirmaReset = false; waAviso = ''; st.step = n; render(); }

function avancar() {
  const errs = validar(st.step);
  if (errs.length) { render(errs); return; }
  if (st.step === 4) {
    st.produtos = st.produtos.filter(p => {
      const nm = (p.nome || '').trim();
      return nm !== '' || [p.mat, p.emb, p.mo, p.out, p.perda, p.qtd, p.preco].some(v => num(v) !== null);
    });
  }
  ir(st.step + 1);
}

function enviarCadastro() {
  const errs = validarLead();
  if (errs.length) { render(errs); return; }
  st.lead.nome = st.lead.nome.trim();
  st.liberado = true;
  render();
}

function copiarResumo() {
  const texto = resumoTexto();
  const area = $('#copy-area');
  copiarTexto(texto).then(okc => {
    if (okc) {
      const b = document.querySelector('#copy-area [data-act="copy"]'); if (b) { b.textContent = 'Resumo copiado'; setTimeout(() => { b.textContent = 'Copiar resumo em texto'; }, 2000); }
    } else if (area && !$('#copybox')) {
      area.insertAdjacentHTML('afterbegin', '<p class="small">Seu aparelho não deixou copiar sozinho. Selecione o texto abaixo e copie.</p><textarea class="copybox" id="copybox" readonly></textarea>');
      const ta = $('#copybox'); ta.value = texto; ta.focus(); ta.select();
    }
  });
}

// ---------------------------------------------------------------- eventos
let salvaTimer = null;
function aoDigitar(ev) {
  const el = ev.target;
  if (!el.dataset || !el.dataset.k) return;
  const k = el.dataset.k, i = Number(el.dataset.i), f = el.dataset.f;
  const v = el.type === 'checkbox' ? el.checked : el.value;
  if (k === 'desp') st.despesas[i][f] = v;
  else if (k === 'prod') st.produtos[i][f] = v;
  else if (k === 'lead') st.lead[f] = v;
  else if (k === 'hp') hpValor = v;
  else st[f] = v;
  const c = $('#c-' + el.id); if (c) c.classList.remove('bad');
  live();
  clearTimeout(salvaTimer); salvaTimer = setTimeout(salvar, 400);
}
app.addEventListener('input', aoDigitar);
app.addEventListener('change', aoDigitar);
document.addEventListener('submit', ev => { ev.preventDefault(); if (ev.target.id === 'leadform') enviarCadastro(); });

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, i = Number(b.dataset.i);
  if (act === 'start') { st = comLead(estadoInicial()); ir(1); }
  else if (act === 'example') { st = estadoExemplo(); ir(1); }
  else if (act === 'resume') ir(1);
  else if (act === 'next') avancar();
  else if (act === 'submit') enviarCadastro();
  else if (act === 'back') ir(st.step === 5 ? 4 : st.step - 1);
  else if (act === 'add-desp') { if (st.despesas.length < 15) { st.despesas.push({ nome: '', valor: '' }); render(null, 'desp-nome-' + (st.despesas.length - 1)); } }
  else if (act === 'rm-desp') { st.despesas.splice(i, 1); render(); }
  else if (act === 'add-prod') { if (st.produtos.length < 100) { st.produtos.push(novoProduto()); render(null, 'p-' + (st.produtos.length - 1) + '-nome'); } }
  else if (act === 'rm-prod') { st.produtos.splice(i, 1); if (!st.produtos.length) st.produtos.push(novoProduto()); render(); }
  else if (act === 'copy') copiarResumo();
  else if (act === 'wa') {                       // não bloqueia o link; só copia a mensagem quando não há número configurado
    if (!CONFIG.WA_NUMERO) {
      const msg = mensagemWA();
      copiarTexto(msg).then(okc => {
        waAviso = okc ? 'Mensagem copiada. Cole na conversa do WhatsApp.' : 'Se a conversa abrir vazia, escreva: ' + esc(msg);
        const n = $('#wa-note'); if (n) { n.hidden = false; n.className = 'wa-note'; n.innerHTML = waAviso; }
      });
    }
  }
  else if (act === 'reset') {
    if (!confirmaReset) { confirmaReset = true; b.textContent = 'Confirmar: apagar tudo e recomeçar'; }
    else { confirmaReset = false; st = comLead(estadoInicial()); temRascunho = false; try { localStorage.removeItem(LS); } catch (e) {} render(); }
  }
});

carregar();
render();
reenviarPendente();
</script>
